[paths]
raw_data_dir = /path/to/input_data
graph_cache_dir = /path/to/
run_dir = /path/to/train_model

[dataset]
name = graphene
orbital_spec_file = config/orbitals/graphene_13x13.json

[task]
target = force

[runtime]
use_gpu = True
device = cuda:0
data_workers = 0

[optimizer]
lr = 0.001
epochs = 20000
batch_size = 1

[split]
train = 0.6
validation = 0.2
test = 0.2

[model]
circuit_layers = 6
qbits = 8
